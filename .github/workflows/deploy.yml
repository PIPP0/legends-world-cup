name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          VITE_PAYPAL_CLIENT_ID: ${{ vars.PAYPAL_CLIENT_ID }}
          VITE_PAYMENT_API: ${{ vars.PAYMENT_API }}
          VITE_COBRO: ${{ vars.COBRO }}
          VITE_ENCUESTAS_API: ${{ vars.ENCUESTAS_API }}
          VITE_FIREBASE_CONFIG: ${{ vars.FIREBASE_CONFIG }}
          VITE_DONATE_URL: ${{ vars.DONATE_URL }}
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
